<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduSync</title>
<meta name="theme-color" content="#4338CA">
<meta name="description" content="EduSync: attendance, assignments, AI tutor and safe chat for campuses.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#101828; --muted:#5B6479; --line:#E3E6EF;
  --brand:#4338CA; --brand-ink:#FFFFFF; --ok:#0E7C5A; --warn:#B45309; --bad:#B42318; --tint:#EEF0FF;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
  --font-head:"Bricolage Grotesque",system-ui,sans-serif; --font:"Figtree",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#141A33; --ink:#EEF1FF; --muted:#A5ADC9; --line:#242C4F;
    --brand:#9AA1FF; --brand-ink:#0B1020; --ok:#4CD1A0; --warn:#F2B35C; --bad:#FF8E84; --tint:#1E2548; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141A33; --ink:#EEF1FF; --muted:#A5ADC9; --line:#242C4F;
  --brand:#9AA1FF; --brand-ink:#0B1020; --ok:#4CD1A0; --warn:#F2B35C; --bad:#FF8E84; --tint:#1E2548; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
p{margin:.4em 0}
.mark{width:30px;height:30px;color:var(--brand);flex:none}
/* shell */
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto}
.col{display:flex;flex-direction:column;min-width:0}
header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:700;font-size:1.2rem;color:var(--ink)}
.sp{flex:1}
.pill{font-size:.78rem;padding:3px 11px;border-radius:99px;background:var(--tint);color:var(--brand);font-weight:600;text-transform:capitalize}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--brand)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#7C6CF6);color:#fff;font-weight:700;font-size:.82rem;flex:none}
main{flex:1;padding:18px 16px 96px;max-width:900px;width:100%}
main>h2:first-child{font-size:1.65rem;margin-bottom:2px}
.hero{background:linear-gradient(135deg,#3730A3,#5B4FE0 60%,#7C6CF6);color:#fff;border-radius:20px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero h2{color:#fff;font-size:1.6rem}.hero .muted{color:rgba(255,255,255,.86);margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:1.05rem;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--font-head);font-size:1.85rem;color:var(--brand);line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.muted{color:var(--muted)}.small{font-size:.86rem}
.sim{display:inline-block;font-size:.76rem;background:var(--tint);color:var(--muted);padding:2px 9px;border-radius:99px}
/* nav: bottom bar on phones, sidebar on desktop */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.bottom .inner{display:flex;width:100%;max-width:720px}
nav.bottom button{flex:1;border:0;background:none;padding:9px 2px;min-height:58px;cursor:pointer;color:var(--muted);font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--brand);font-weight:600}
nav.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.side-brand,.side-user{display:none}
@media (min-width:900px){
  .app{grid-template-columns:250px minmax(0,1fr)}
  nav.bottom{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:18px;padding:22px 14px;border-top:0;border-right:1px solid var(--line);align-self:start}
  nav.bottom .inner{flex-direction:column;gap:4px;max-width:none}
  nav.bottom button{flex:none;flex-direction:row;gap:12px;justify-content:flex-start;padding:0 14px;min-height:44px;border-radius:12px;font-size:.95rem}
  nav.bottom button:hover{background:var(--tint)}
  nav.bottom button[aria-current="page"]{background:var(--tint)}
  nav.bottom button[aria-current="page"]::before{display:none}
  .side-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:1.3rem;padding:0 6px}
  .side-user{display:flex;align-items:center;gap:10px;margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px}
  header.top .logo{display:none}
  main{padding:26px 32px 48px}
}
/* sign-in */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.auth-art{background:linear-gradient(150deg,#312E81,#4F46E5 55%,#7C6CF6);color:#fff;padding:28px 22px 30px;--mark-ink:#4338CA}
.auth-art .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:1.3rem}
.auth-art .mark{color:#fff}
.auth-art h1{font-size:1.7rem;margin:22px 0 8px;color:#fff}
.auth-art p{color:rgba(255,255,255,.88);max-width:34ch}
.auth-art ul{display:none;list-style:none;padding:0;margin:22px 0 0}
.auth-art li{padding:8px 0 8px 28px;position:relative;color:rgba(255,255,255,.95)}
.auth-art li::before{content:"";position:absolute;left:0;top:13px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 4px rgba(255,255,255,.9)}
.auth-form{display:grid;place-items:center;padding:24px 16px 40px}
.login{width:100%;max-width:400px}
.login h2{font-size:1.7rem}
@media (min-width:900px){
  .auth{grid-template-columns:1.05fr 1fr}
  .auth-art{padding:56px 52px;display:flex;flex-direction:column;justify-content:center}
  .auth-art h1{font-size:2.6rem}.auth-art ul{display:block}
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:20px 0 14px;padding:4px;background:var(--tint);border-radius:14px}
.tabs button{padding:9px;border-radius:10px;border:0;background:transparent;cursor:pointer;min-height:42px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.tabs.two{grid-template-columns:repeat(2,1fr);margin:12px 0}
/* forms + buttons */
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 5px}
input,textarea,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-height:46px}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{resize:vertical}
.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),#6B5CE7);color:var(--brand-ink);font-weight:600;cursor:pointer;min-height:48px;box-shadow:0 6px 16px rgba(67,56,202,.22)}
.btn:hover{filter:brightness(1.06)}
.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:12px;min-height:42px;padding:0 15px;cursor:pointer;font-weight:600}
.sbtn:hover{border-color:var(--brand);background:var(--tint)}
.sbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.err{color:var(--bad);margin-top:10px;font-weight:500}.okm{color:var(--ok);margin-top:10px;font-weight:500}
.hint{font-size:.88rem;color:var(--muted);margin-top:16px;padding:12px 14px;background:var(--tint);border-radius:12px}
.bar{height:9px;border-radius:99px;background:var(--tint);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7C6CF6);border-radius:99px}
.chips{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 15px;min-height:38px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{font-size:.76rem;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--brand);font-weight:600}
.tag.ach{color:var(--ok)}
.vac{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.acts{display:flex;flex-direction:column;gap:6px}
code{background:var(--tint);padding:1px 6px;border-radius:6px}
video{background:#000}
@media (prefers-reduced-motion:no-preference){.card,.stat,.sbtn,.btn,.chip{transition:border-color .15s,background .15s,filter .15s}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script>
/* ========== 1. MOCK DATA (Phase 1) ========== */
const DATA = {
  classes:[{id:"c1",name:"TY-CS-A",dept:"CS",year:3,division:"A"}],
  subjects:[
    {id:"s1",name:"Database Systems",short:"DBMS"},
    {id:"s2",name:"Operating Systems",short:"OS"},
    {id:"s3",name:"Computer Networks",short:"CN"},
    {id:"s4",name:"Software Engineering",short:"SE"}],
  // demo passwords only; real auth arrives in Tier B
  users:[
    {id:"u1",name:"Aarav Mehta",role:"student",login:"TY01",pw:"demo123",dept:"CS",classId:"c1",status:"approved",behaviour:4},
    {id:"u2",name:"Diya Nair",role:"student",login:"TY02",pw:"demo123",dept:"CS",classId:"c1",status:"approved",behaviour:2},
    {id:"u3",name:"Kabir Shah",role:"student",login:"TY03",pw:"demo123",dept:"CS",classId:"c1",status:"approved",behaviour:0},
    {id:"u4",name:"Isha Rao",role:"student",login:"TY04",pw:"demo123",dept:"CS",classId:"c1",status:"pending",behaviour:0},
    {id:"t1",name:"Prof. Sunita Kulkarni",role:"teacher",login:"sunita@edusync.demo",pw:"demo123",dept:"CS",status:"approved"},
    {id:"t2",name:"Prof. Rahul Desai",role:"teacher",login:"rahul@edusync.demo",pw:"demo123",dept:"CS",status:"approved"},
    {id:"a1",name:"Admin Office",role:"admin",login:"admin@edusync.demo",pw:"demo123",status:"approved"}],
  timetable:[
    {id:"tt1",classId:"c1",subjectId:"s1",teacherId:"t1",day:"Mon",start:"09:00",end:"10:00",room:"204"},
    {id:"tt2",classId:"c1",subjectId:"s2",teacherId:"t2",day:"Mon",start:"10:30",end:"11:30",room:"204"},
    {id:"tt3",classId:"c1",subjectId:"s3",teacherId:"t2",day:"Tue",start:"09:00",end:"10:00",room:"Lab 2"},
    {id:"tt4",classId:"c1",subjectId:"s4",teacherId:"t1",day:"Wed",start:"11:00",end:"12:00",room:"204"},
    {id:"tt5",classId:"c1",subjectId:"s1",teacherId:"t1",day:"Thu",start:"09:00",end:"10:00",room:"204"},
    {id:"tt6",classId:"c1",subjectId:"s2",teacherId:"t2",day:"Fri",start:"10:30",end:"11:30",room:"204"}],
  syllabus:{s1:{Unit1:["ER model","Relational model"],Unit2:["SQL basics","Normalization"]},
            s2:{Unit1:["Processes","Threads"],Unit2:["Scheduling","Deadlocks"]}},
  posts:[
    {id:"p1",authorId:"t1",type:"event",body:"Database quiz night on Friday 31 Oct, 5 pm in Room 204. Teams of three. Bring your own pen.",when:"27 Oct",likes:["u1"]},
    {id:"p2",authorId:"u2",type:"achievement",body:"Our team placed second at the state-level hackathon. Thank you to everyone who helped us debug at 2 am.",when:"25 Oct",likes:["u1","u3"]},
    {id:"p3",authorId:"u1",type:"event",body:"Coding Club meet-up on Monday after lectures. We will solve three contest problems together.",when:"24 Oct",likes:[]}],
  clubs:[
    {id:"cl1",name:"Coding Club",leadId:"u1",about:"Weekly contest practice and project nights for anyone who likes building things.",vacancies:[{id:"v1",title:"Event coordinator",detail:"Plan the monthly contest and book rooms. About 2 hours a week.",volunteers:["u3"]}]},
    {id:"cl2",name:"Literary Club",leadId:"t1",about:"Debates, poetry readings and the college magazine.",vacancies:[{id:"v2",title:"Magazine editor",detail:"Collect and proofread student articles.",volunteers:[]}]},
    {id:"cl3",name:"Photography Club",leadId:"u2",about:"Photo walks and coverage of campus events.",vacancies:[]}]
};
Object.assign(DATA,{
  history:{u1:{s1:{held:20,attended:14},s2:{held:18,attended:17},s3:{held:16,attended:12},s4:{held:10,attended:9}},
           u2:{s1:{held:20,attended:18},s2:{held:18,attended:16},s3:{held:16,attended:15},s4:{held:10,attended:10}},
           u3:{s1:{held:20,attended:12},s2:{held:18,attended:11},s3:{held:16,attended:9},s4:{held:10,attended:6}}},
  session:null,
  assignments:[
    {id:"a1",kind:"assignment",subjectId:"s1",teacherId:"t1",title:"ER diagram for a library",due:"2026-11-05",desc:"Draw the ER diagram and list the keys."},
    {id:"a2",kind:"note",subjectId:"s2",teacherId:"t2",title:"Scheduling algorithms summary",due:"",desc:"Notes for Unit 2."},
    {id:"a3",kind:"pyq",subjectId:"s1",teacherId:"t1",title:"DBMS 2025 paper",due:"",desc:"Previous year questions."}],
  submissions:[{aid:"a1",uid:"u2",text:"ER diagram link",at:"2026-10-27",late:false}]
});
const byId=(list,id)=>list.find(x=>x.id===id);
const subj=id=>byId(DATA.subjects,id);
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ========== 2. SERVICES ========== */
const authService={
  // Returns {user} or {error} with a friendly message
  login(role,login,pw){
    if(!login.trim()||!pw) return {error:"Enter both your ID and password."};
    const u=DATA.users.find(x=>x.role===role&&x.login.toLowerCase()===login.trim().toLowerCase());
    if(!u||u.pw!==pw) return {error:"That ID and password don’t match for this role. Check the demo logins below."};
    if(u.status==="pending") return {error:"Your account is waiting for admin approval. Try again once it is approved."};
    return {user:u};
  }
};

/* ========== 3. NAV CONFIG ========== */
const ico=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I={
  home:ico('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  check:ico('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'),
  doc:ico('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>'),
  spark:ico('<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>'),
  chat:ico('<path d="M4 5h16v11H9l-5 4z"/>'),
  users:ico('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><path d="M16 5a3 3 0 0 1 0 6M18 14c2 .7 3 2.8 3 6"/>'),
  coin:ico('<circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6v1.5M12 16.5V18"/>'),
  mega:ico('<path d="M3 10v4h3l8 4V6L6 10z"/><path d="M18 9c1.3 1 1.3 5 0 6"/>'),
  flag:ico('<path d="M5 21V4h12l-2 4 2 4H5"/>'),
  star:ico('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>')
};
const NAV={
  student:[["home","Home",I.home,0],["att","Attendance",I.check,2],["work","Tasks",I.doc,4],["tutor","Tutor",I.spark,5],["campus","Campus",I.star,8],["chat","Chat",I.chat,6]],
  teacher:[["home","Home",I.home,0],["classes","Classes",I.users,3],["att","Attendance",I.check,3],["work","Tasks",I.doc,4],["campus","Campus",I.star,8],["chat","Chat",I.chat,6]],
  admin:[["home","Home",I.home,0],["appr","Approvals",I.check,7],["fees","Fees",I.coin,7],["bcast","Broadcast",I.mega,7],["mod","Reports",I.flag,7],["campus","Campus",I.star,8]]
};

/* ========== 4. STATE ========== */
const state={user:null,role:"student",tab:"home",error:"",campusTab:"feed",feedFilter:"all",msg:"",draft:"",draftType:"general"};

/* ========== 5. SCREENS ========== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function placeholder(label,phase){
  return `<div class="card"><h3>${esc(label)}</h3><p class="muted">This screen is built in Phase ${phase}. The navigation and login already work.</p></div>`;
}
function ttRow(t,who){
  const s=subj(t.subjectId);
  const extra=who==="student"?byId(DATA.users,t.teacherId).name:byId(DATA.classes,t.classId).name;
  return `<div class="row"><div><b>${esc(s.short)}</b> <span class="muted">${esc(extra)}</span></div><div>${t.day} ${t.start}–${t.end} · Room ${esc(t.room)}</div></div>`;
}
function studentHome(u){
  const cls=byId(DATA.classes,u.classId);
  const tt=DATA.timetable.filter(t=>t.classId===u.classId);
  return `<div class="hero"><h2>Hi, ${esc(u.name.split(" ")[0])}</h2><p class="muted">${esc(cls.name)} · Behaviour score ${u.behaviour>=0?"+":""}${u.behaviour}</p></div>
  <div class="stats"><div class="stat"><b>${DATA.subjects.length}</b><span>Subjects</span></div><div class="stat"><b>${tt.length}</b><span>Lectures a week</span></div></div>
  <div class="card"><h3>Your timetable</h3>${tt.map(t=>ttRow(t,"student")).join("")}</div>`;
}
function teacherHome(u){
  const tt=DATA.timetable.filter(t=>t.teacherId===u.id);
  const n=DATA.users.filter(x=>x.role==="student"&&x.status==="approved").length;
  return `<div class="hero"><h2>${esc(u.name)}</h2><p class="muted">${esc(u.dept)} department</p></div>
  <div class="stats"><div class="stat"><b>${tt.length}</b><span>Lectures a week</span></div><div class="stat"><b>${n}</b><span>Students in TY-CS-A</span></div></div>
  <div class="card"><h3>Who teaches what</h3>${tt.map(t=>ttRow(t,"teacher")).join("")}</div>`;
}
function adminHome(u){
  const pend=DATA.users.filter(x=>x.status==="pending");
  const c=r=>DATA.users.filter(x=>x.role===r).length;
  return `<div class="hero"><h2>Admin overview</h2><p class="muted">${esc(u.name)}</p></div>
  <div class="stats"><div class="stat"><b>${c("student")}</b><span>Students</span></div><div class="stat"><b>${c("teacher")}</b><span>Teachers</span></div><div class="stat"><b>${pend.length}</b><span>Waiting for approval</span></div></div>
  <div class="card"><h3>Pending accounts</h3>${pend.length?pend.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="muted">${p.role}</span></div>`).join(""):'<p class="muted">Nothing waiting.</p>'}</div>`;
}
/* ===== CAMPUS: feed + clubs ===== */
const BAD=/\b(idiot|stupid|hate you|shut up|damn)\b/i; // simulated word filter; real moderation is Phase 6

const uname=id=>(byId(DATA.users,id)||{name:"Unknown"}).name;

// Need n more lectures in a row so (a+n)/(h+n) >= t  =>  n >= (t*h-a)/(1-t). At 75% that is 3h-4a.
// Example: held 20, attended 14 -> n = 4. Bunk budget: missed m lectures allowed => a/(h+m) >= t.
function calcAttendance(held,attended,target=0.75){
  const E=1e-9, pct=held?attended/held*100:100;
  const needed=Math.max(0,Math.ceil((target*held-attended)/(1-target)-E));
  const bunk=held&&attended/held>=target?Math.floor(attended/target-held+E):0;
  return {pct,needed,bunk};
}
console.assert(calcAttendance(20,14).needed===4&&calcAttendance(20,18).bunk===4,"calcAttendance self-test failed");
const WIN=20000; // QR code rotates every 20 s (simulated signing; real signing needs the Tier B server)
const tok=(sid,w)=>{let h=2166136261;for(const ch of sid+":"+w){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36).toUpperCase().padStart(6,"0").slice(-6);};
const attService={
  start(ttId){DATA.session={id:"S"+Date.now(),ttId,scanned:[]};},
  mark(u,code,inside){
    const s=DATA.session;
    if(!s) return {error:"No lecture is taking attendance right now."};
    const tt=byId(DATA.timetable,s.ttId);
    if(tt.classId!==u.classId) return {error:"You are not enrolled in this class."};
    if(s.scanned.includes(u.id)) return {error:"Already marked present for this lecture."};
    if(!inside) return {error:"You seem to be outside the classroom. Move closer and try again."};
    const w=Math.floor(Date.now()/WIN);
    if(![w,w-1].some(x=>tok(s.id,x)===code.trim().toUpperCase())) return {error:"That code is wrong or expired. Read the new code under the QR."};
    s.scanned.push(u.id);return {ok:"Marked present for "+subj(tt.subjectId).short+"."};
  },
  close(){
    const s=DATA.session,tt=byId(DATA.timetable,s.ttId);
    DATA.users.filter(x=>x.role==="student"&&x.status==="approved"&&x.classId===tt.classId).forEach(st=>{
      const h=DATA.history[st.id][tt.subjectId];h.held++;if(s.scanned.includes(st.id))h.attended++;});
    DATA.session=null;
  }
};

const tkey=(s,u,t)=>s+"|"+u+"|"+t;

// aiTutorService: the only place that talks to an AI. Tier B swaps this for a backend that calls Groq.
const aiTutorService={
  prompt(sid){return `You are a friendly college tutor for ${subj(sid).name}. Syllabus: ${Object.entries(DATA.syllabus[sid]).map(([u,l])=>u+": "+l.join(", ")).join("; ")}. Teach only topics from this syllabus. If asked about anything else, politely decline and steer back to the syllabus. Keep it simple and short.`;},
  async run(mode,sid,unit,topic,q){
    const k=mode+tkey(sid,unit,topic)+(q||"");if(TC[k])return TC[k];
    const sample=window.claude&&claude.use?await claude.use("sample"):null;
    if(!sample)throw new Error("the AI tutor needs the Ask Claude permission, which is not available in this view.");
    const sys=this.prompt(sid)+` Current topic: ${topic} (${unit}).`;
    let r;
    if(mode==="quiz"){r=await sample.json(sys+" Return only a JSON array of 3 multiple-choice questions. Each item has keys q, options (4 strings), answer (index 0 to 3) and why.",{cache:false});if(!Array.isArray(r)||!r.length)throw new Error("the quiz came back in the wrong shape. Try again.");}
    else r=(await sample(sys+(mode==="ask"?` Student question: ${q}`:" Explain this topic in under 150 words, then give one real-life example."),{cache:false})).text;
    return TC[k]=r;
  }
};
async function runTutor(mode){
  const q=mode==="ask"?(document.getElementById("tq").value.trim()):"";
  if(mode==="ask"&&q.length<3){TU.err="Type a question first.";return render();}
  TU.busy=true;TU.err="";if(mode==="quiz"){TU.quiz=null;TU.ans={};}else TU.out="";render();
  try{const r=await aiTutorService.run(mode,TU.sid,TU.unit,TU.topic,q);if(mode==="quiz")TU.quiz=r;else TU.out=r;}
  catch(e){TU.err="Tutor unavailable: "+(e.message||"try again.");}

}

  async verify(u){
    const id=bioId(u);if(!id)throw new Error("Set up your fingerprint or screen lock first.");
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64(id)}],userVerification:"required",timeout:60000}});
  }
};
function bioHtml(u){
  const f=!!faceStore.get(u.id),w=!!bioId(u);
  return `<div class="card"><h3>Face and biometric check</h3><p class="muted small">Enter the code under the QR above, then verify yourself to mark attendance.</p>
  <p class="small">Face: <b>${f?"enrolled":"not enrolled"}</b>. Device biometric: <b>${w?"set up":"not set up"}</b></p>
  <label><input type="checkbox" id="fcons" style="width:auto;min-height:0"> I agree to keep my face template on this device only. I can delete it at any time.</label>
  <p><button class="sbtn" data-face="enrol">Enrol my face</button> ${f?'<button class="sbtn" data-face="del">Delete face data</button> ':""}<button class="sbtn" data-bio="1">Set up fingerprint or screen lock</button></p>
  <button class="btn" data-fmark="face">Verify face and mark present</button><button class="btn" data-fmark="bio">Verify fingerprint and mark present</button>${bmHtml()}
  <p class="muted small"><span class="sim">No liveness check: a photo can fool the face match. Tier B adds server checks</span></p></div>`;
}
function bindBio(root){
  const u=state.user,q=(s,fn)=>root.querySelectorAll(s).forEach(b=>b.onclick=()=>fn(b));
  const say=(t,m)=>{BM={t,m};render();};
  const run=async(fn,ok)=>{try{await fn();say("ok",ok);}catch(e){say("err",e.name==="NotAllowedError"?"Permission was refused or the prompt was cancelled.":(e.message||"That did not work."));}};
  q("[data-face]",b=>{
    if(b.dataset.face==="del"){faceStore.del(u.id);return say("ok","Face data deleted.");}
    if(!root.querySelector("#fcons").checked)return say("err","Tick the consent box first.");
    run(async()=>{faceStore.set(u.id,await captureFace("Look at the camera to enrol",3));},"Face enrolled on this device.");
  });
  q("[data-bio]",()=>run(()=>bioService.enrol(u),"Device biometric set up."));
  q("[data-fmark]",b=>run(async()=>{
    if(!DATA.session)throw new Error("No lecture is taking attendance right now.");
    const code=root.querySelector("#ac").value,inside=root.querySelector("#inside").checked;
    if(b.dataset.fmark==="face")await verifyFace(u);else await bioService.verify(u);
    const r=attService.mark(u,code,inside);if(r.error)throw new Error(r.error);
  },"Verified. Attendance marked."));
}
function screen(){
  const u=state.user, item=NAV[u.role].find(n=>n[0]===state.tab)||NAV[u.role][0];
  if(item[0]==="chat") return chatView(u).replace('<div class="card"><h3>Encryption</h3>',videoHtml(u)+'<div class="card"><h3>Encryption</h3>');
  if(item[0]==="mod") return modView();
  if(item[0]==="classes") return classesView(u);
  if(item[0]==="tutor") return tutorView(u);
  if(item[0]==="appr") return apprView();
  if(item[0]==="fees") return feesView();
  if(item[0]==="bcast") return bcastView();
  if(item[0]==="att") return attView(u)+(u.role==="student"?bioHtml(u):"");
  if(item[0]==="work") return workView(u);
  if(item[0]==="campus") return campusView(u);
  if(item[0]==="home") return {student:studentHome,teacher:teacherHome,admin:adminHome}[u.role](u)+annHtml(u);
  return placeholder(item[1],item[3]);
}

/* ========== 6. RENDER ========== */
const MARK='<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M6 13l10-5 10 5-10 5z" style="fill:var(--mark-ink,#fff)"/><path d="M10 16.5v4.2c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.2l-6 3z" style="fill:var(--mark-ink,#fff);opacity:.8"/></svg>';
const ICON_THEME='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>';
const ICON_OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>';
const ini=n=>n.replace(/^(Prof\.|Dr\.)\s*/,"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function loginView(){
  const labels={student:"Roll number",teacher:"Email",admin:"Email"};
  const hints={student:"TY01 / demo123",teacher:"sunita@edusync.demo / demo123",admin:"admin@edusync.demo / demo123"};
  return `<div class="auth"><aside class="auth-art"><div class="brand">${MARK}<span>EduSync</span></div><h1>One campus.<br>One smart platform.</h1><p>Attendance, assignments, an AI tutor and safe chat for students, teachers and admins.</p>
  <ul><li>Rotating QR plus face or fingerprint check</li><li>Syllabus-grounded AI tutor</li><li>Encrypted, moderated chat</li></ul></aside>
  <section class="auth-form"><div class="login"><h2>Welcome back</h2><p class="muted">Sign in to continue.</p>
  <div class="tabs" role="group" aria-label="Sign in as">${["student","teacher","admin"].map(r=>`<button data-role="${r}" aria-pressed="${state.role===r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join("")}</div>
  <label for="lg">${labels[state.role]}</label><input id="lg" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="err" role="alert">${esc(state.error)}</div>
  <button class="btn" id="go">Sign in</button>
  <div class="hint">Demo login: ${hints[state.role]}<br><span class="sim">Simulated sign-in, no real accounts</span></div></div></section></div>`;
}
function appView(){
  const u=state.user,av=esc(ini(u.name));
  return `<div class="app"><nav class="bottom" aria-label="Main"><div class="side-brand">${MARK}<span>EduSync</span></div>
  <div class="inner">${NAV[u.role].map(n=>`<button data-tab="${n[0]}" ${n[0]===state.tab?'aria-current="page"':""}>${n[2]}${n[1]}</button>`).join("")}</div>
  <div class="side-user"><span class="avatar" aria-hidden="true">${av}</span><div><b>${esc(u.name)}</b><div class="muted small">${u.role}</div></div></div></nav>
  <div class="col"><header class="top"><span class="logo">${MARK}EduSync</span><span class="sp"></span><span class="pill">${u.role}</span>
  <button class="icon-btn" id="theme" aria-label="Switch light or dark theme">${ICON_THEME}</button><button class="icon-btn" id="out" aria-label="Sign out">${ICON_OUT}</button><span class="avatar" aria-hidden="true">${av}</span></header>
  <main>${screen()}</main></div></div>`;
}
function render(){
  const root=document.getElementById("root");
  root.innerHTML=state.user?appView():loginView();
  if(!state.user){
    root.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.error="";render();});
    const go=()=>{
      const r=authService.login(state.role,document.getElementById("lg").value,document.getElementById("pw").value);
      if(r.error){state.error=r.error;document.getElementById("err").textContent=r.error;return;}
      state.user=r.user;state.tab="home";state.error="";render();
    };
    document.getElementById("go").onclick=go;
    root.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go();});
  }else{
    root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.msg="";AM.m="";BM.m="";render();window.scrollTo(0,0);});
    document.getElementById("out").onclick=()=>{state.user=null;render();};
    bindCampus(root);
    bindAcademic(root);
    bindPhase57(root);
    bindPhase6(root);
    bindVideo(root);
    bindBio(root);
    document.getElementById("theme").onclick=()=>{
      const h=document.documentElement;
      const dark=h.dataset.theme?h.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
      h.dataset.theme=dark?"light":"dark";
    };
  }
}
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
